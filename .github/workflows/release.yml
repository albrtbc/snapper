name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:watcher
      - run: npm audit --audit-level=high
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxext6 libgtk-3-0 libnss3 libasound2
      - run: xvfb-run -a npm run test:ui
      - run: xvfb-run -a npm run test:visibility
      - run: xvfb-run -a npm run test:interaction
      - run: npm run dist
      - run: npm run test:appimage
      - run: xvfb-run -a npm run test:variants -- --packaged-variants
      - run: npm run source:archive
      - run: npm run release:checksums
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Snapper-${VERSION}-linux-x86_64.AppImage" \
            "dist/snapper-${VERSION}-source.tar.gz" dist/SHA256SUMS \
            --verify-tag --title "Snapper ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${VERSION}.md" --latest
